<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f97316 0%, #ec4899 50%, #a855f7 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 40px 20px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .bg-shapes {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.3);
            top: 10%;
            left: 10%;
            animation: float 6s ease-in-out infinite;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: rgba(255, 200, 150, 0.3);
            bottom: 20%;
            right: 10%;
            animation: float 8s ease-in-out infinite reverse;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: rgba(200, 150, 255, 0.3);
            top: 50%;
            left: 50%;
            animation: float 7s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(249, 115, 22, 0.2);
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            color: #f97316;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .form-card {
            padding: 8px;
            margin-bottom: 24px;
            animation: slideIn 0.6s ease-out 0.2s both;
        }

        form {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(249, 115, 22, 0.1);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background: rgba(249, 115, 22, 0.15);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }

        .input-wrapper svg {
            width: 20px;
            height: 20px;
            color: #f97316;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 1rem;
            font-family: inherit;
            color: #1f2937;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #9ca3af;
        }

        button[type="submit"] {
            padding: 16px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        button[type="submit"]:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        button[type="submit"] svg {
            width: 20px;
            height: 20px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            animation: taskSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.3s ease;
        }

        .task-item:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        @keyframes taskSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .checkbox:hover {
            border-color: #f97316;
            transform: scale(1.1);
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-color: #f97316;
            animation: checkBounce 0.3s ease;
        }

        @keyframes checkBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .checkbox svg {
            width: 14px;
            height: 14px;
            color: white;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .checkbox.checked svg {
            opacity: 1;
        }

        .task-title {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            color: #1f2937;
            position: relative;
            transition: color 0.3s ease;
        }

        .text-strikethrough {
            color: #9ca3af;
        }

        .text-strikethrough::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: #9ca3af;
            animation: strikethrough 0.3s ease forwards;
        }

        @keyframes strikethrough {
            from { width: 0; }
            to { width: 100%; }
        }

        .task-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .task-actions a {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-toggle {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .btn-toggle:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: scale(1.05);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.05);
        }

        @media (max-width: 640px) {
            h1 { font-size: 2rem; }
            form { flex-direction: column; }
            .input-wrapper { width: 100%; }
            button[type="submit"] { width: 100%; padding: 14px; }
            .task-actions { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
</div>

<div class="container">
    <div class="header">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
        </div>
        <h1>Todo Application</h1>
        <p class="subtitle">Stay organized, achieve more</p>
    </div>

    <div class="form-card glass">
        <form action="/" method="post">
            <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
                <input type="text" name="title" placeholder="What needs to be done?" required>
            </div>
            <button type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </form>
    </div>

    <div class="task-list">
        <th:block th:each="task : ${tasks}">
            <div class="task-item glass">
                <a th:href="@{/{id}/toggle(id=${task.id})}" style="text-decoration: none;">
                    <div th:class="${task.completed} ? 'checkbox checked' : 'checkbox'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </a>
                <span class="task-title" th:classappend="${task.completed} ? ' text-strikethrough'" th:text="${task.title}">Task Title</span>
                <div class="task-actions">
                    <a th:href="@{/{id}/toggle(id=${task.id})}" class="btn-toggle">Toggle</a>
                    <a th:href="@{/{id}/delete(id=${task.id})}" class="btn-delete">Delete</a>
                </div>
            </div>
        </th:block>
    </div>
</div>
</body>
</html>
